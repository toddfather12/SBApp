<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southern Bay Construction</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark:#1A2733; --mid:#2C3E50; --terra:#B85038; --amber:#C49A3C;
    --cream:#F7F2EB; --sand:#EDE5D8; --white:#FFFFFF; --txt:#2C3440;
    --txt-m:#5A6A7A; --txt-l:#8A9AB0; --border:#D5C9BC; --green:#3A6A5A;
    --green-l:#EAF3E8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--txt);min-height:100vh}

  /* HEADER */
  .header{background:var(--dark);border-bottom:3px solid var(--terra);padding:0 32px;height:60px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .h-brand{display:flex;align-items:center;gap:14px}
  .h-logo{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    color:var(--terra);letter-spacing:2px;text-transform:uppercase}
  .h-sep{width:1px;height:20px;background:#2C3E50}
  .h-sub{font-family:'DM Serif Display';font-size:17px;color:var(--white)}
  .btn-new{background:var(--terra);color:#fff;border:none;border-radius:6px;
    padding:9px 20px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
    cursor:pointer;transition:background .15s;letter-spacing:.3px}
  .btn-new:hover{background:#A04030}

  /* PAGE */
  .page{max-width:1100px;margin:0 auto;padding:36px 24px}
  .pg-title{font-family:'DM Serif Display';font-size:28px;color:var(--txt);margin-bottom:6px}
  .pg-sub{font-size:14px;color:var(--txt-m);margin-bottom:32px}

  /* STATS */
  .stats{display:flex;gap:16px;margin-bottom:36px;flex-wrap:wrap}
  .stat{background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:16px 24px;flex:1;min-width:140px;text-align:center}
  .stat-n{font-family:'DM Serif Display';font-size:32px;color:var(--terra)}
  .stat-l{font-size:12px;color:var(--txt-m);margin-top:2px}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}

  /* PROJECT CARD */
  .card{background:var(--white);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .15s;text-decoration:none;color:inherit}
  .card:hover{box-shadow:0 6px 28px rgba(0,0,0,.1);transform:translateY(-2px)}
  .card-head{background:var(--dark);padding:16px 20px;display:flex;align-items:flex-start;
    justify-content:space-between;gap:10px}
  .card-name{font-family:'DM Serif Display';font-size:18px;color:var(--white);line-height:1.3}
  .card-client{font-size:12px;color:#6A8AA0;margin-top:3px}
  .card-status{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
    padding:3px 9px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:2px}
  .s-active{background:#0F2A1A;color:#5AAA80;border:1px solid #204030}
  .s-complete{background:#0A1A28;color:#4A88AA;border:1px solid #1A3040}
  .card-body{padding:16px 20px}
  .card-row{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  .card-field{flex:1;min-width:90px}
  .cf-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;
    color:var(--terra);margin-bottom:2px}
  .cf-val{font-size:13px;color:var(--txt);font-weight:500}
  .cf-val.empty{color:var(--txt-l);font-style:italic}

  /* PROGRESS */
  .prog-wrap{margin-top:4px}
  .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .prog-label{font-size:11px;color:var(--txt-m)}
  .prog-pct{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--terra);font-weight:500}
  .prog-bar{height:5px;background:#EDE5D8;border-radius:3px;overflow:hidden}
  .prog-fill{height:100%;background:var(--terra);border-radius:3px;transition:width .3s}

  /* EMPTY STATE */
  .empty{text-align:center;padding:80px 24px;color:var(--txt-m)}
  .empty-icon{font-size:48px;margin-bottom:16px;opacity:.4}
  .empty-title{font-family:'DM Serif Display';font-size:22px;color:var(--txt);margin-bottom:8px}
  .empty-sub{font-size:14px;line-height:1.6;max-width:380px;margin:0 auto 24px}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--white);border-radius:12px;width:100%;max-width:520px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
  .modal-head{background:var(--dark);padding:20px 24px;border-bottom:2px solid var(--terra)}
  .modal-title{font-family:'DM Serif Display';font-size:20px;color:var(--white)}
  .modal-sub{font-size:12px;color:#6A8AA0;margin-top:3px}
  .modal-body{padding:24px}
  .frow{display:flex;gap:14px;margin-bottom:16px}
  .frow:last-child{margin-bottom:0}
  .fgrp{display:flex;flex-direction:column;flex:1}
  label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;
    color:var(--txt-m);margin-bottom:6px}
  input[type=text],input[type=date]{font-family:'DM Sans',sans-serif;font-size:14px;
    border:1.5px solid var(--border);border-radius:6px;padding:9px 12px;
    outline:none;color:var(--txt);background:var(--white);width:100%;transition:border-color .15s}
  input:focus{border-color:var(--terra)}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--border);
    display:flex;justify-content:flex-end;gap:10px;background:var(--sand)}
  .btn-cancel{background:none;border:1.5px solid var(--border);border-radius:6px;
    padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
    color:var(--txt-m);cursor:pointer;transition:all .15s}
  .btn-cancel:hover{border-color:var(--txt-m);color:var(--txt)}
  .btn-create{background:var(--terra);color:#fff;border:none;border-radius:6px;
    padding:9px 22px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
    cursor:pointer;transition:background .15s}
  .btn-create:hover{background:#A04030}

  /* CARD ACTIONS */
  .card-foot{padding:10px 20px;border-top:1px solid var(--border);background:var(--sand);
    display:flex;justify-content:space-between;align-items:center}
  .card-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--txt-l)}
  .card-del{font-size:11px;color:var(--txt-l);background:none;border:none;cursor:pointer;
    padding:3px 8px;border-radius:4px;transition:all .15s;font-family:'DM Sans',sans-serif}
  .card-del:hover{background:#FEE;color:#C04030}

  @media(max-width:600px){
    .page{padding:24px 16px}
    .frow{flex-direction:column;gap:12px}
    .header{padding:0 16px}
    .h-sub{display:none}
  }
</style>
</head>
<body>

<div class="header">
  <div class="h-brand">
    <span class="h-logo">Southern Bay Construction</span>
    <div class="h-sep"></div>
    <span class="h-sub">Project Manager</span>
  </div>
  <button class="btn-new" onclick="openModal()">+ New Project</button>
</div>

<div class="page">
  <div class="pg-title">Active Projects</div>
  <div class="pg-sub" id="pg-sub">Loading...</div>

  <div class="stats" id="stats-row"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- NEW PROJECT MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">New Project</div>
      <div class="modal-sub">Creates a fresh 10-phase timeline</div>
    </div>
    <div class="modal-body">
      <div class="frow">
        <div class="fgrp" style="flex:2">
          <label>Project Name *</label>
          <input type="text" id="f-name" placeholder="Smith Residence — Custom Home Build">
        </div>
      </div>
      <div class="frow">
        <div class="fgrp">
          <label>Client Name</label>
          <input type="text" id="f-client" placeholder="John & Jane Smith">
        </div>
        <div class="fgrp">
          <label>Property Address</label>
          <input type="text" id="f-addr" placeholder="123 Main St, Mobile, AL">
        </div>
      </div>
      <div class="frow">
        <div class="fgrp">
          <label>Contract Date</label>
          <input type="date" id="f-start">
        </div>
        <div class="fgrp">
          <label>Est. Completion</label>
          <input type="date" id="f-end">
        </div>
        <div class="fgrp">
          <label>Project Manager</label>
          <input type="text" id="f-pm" placeholder="Damian">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-create" onclick="createProject()">Create Project</button>
    </div>
  </div>
</div>

<script>
const TOTAL_TASKS = 65; // approximate across all 10 phases

async function load() {
  const projects = await fetch('/api/projects').then(r => r.json());

  // stats
  const active = projects.filter(p => p.status === 'active').length;
  const pct = p => p.tasks_total > 0 ? Math.round((p.tasks_done / p.tasks_total) * 100) : 0;
  const avgProg = projects.length
    ? Math.round(projects.reduce((a, p) => a + pct(p), 0) / projects.length)
    : 0;

  document.getElementById('pg-sub').textContent =
    projects.length === 0 ? 'No projects yet — create one to get started'
    : `${projects.length} project${projects.length !== 1 ? 's' : ''} · ${active} active`;

  document.getElementById('stats-row').innerHTML = projects.length ? `
    <div class="stat"><div class="stat-n">${projects.length}</div><div class="stat-l">Total Projects</div></div>
    <div class="stat"><div class="stat-n">${active}</div><div class="stat-l">Active</div></div>
    <div class="stat"><div class="stat-n">${avgProg}%</div><div class="stat-l">Avg. Progress</div></div>
  ` : '';

  const grid = document.getElementById('grid');
  if (!projects.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🏗</div>
      <div class="empty-title">No projects yet</div>
      <div class="empty-sub">Create your first project to start tracking the build timeline, tasks, and client communications.</div>
      <button class="btn-new" onclick="openModal()">+ Create First Project</button>
    </div>`;
    return;
  }

  grid.innerHTML = projects.map(p => {
    const progress = pct(p);
    const hasDate = d => d && d.trim();
    const fmt = d => {
      if (!hasDate(d)) return null;
      const parts = d.split('-');
      if (parts.length < 3) return d;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[parseInt(parts[1]) - 1]} ${parseInt(parts[2])}, ${parts[0]}`;
    };

    return `
    <a class="card" href="/project.html?id=${p.id}">
      <div class="card-head">
        <div>
          <div class="card-name">${p.name}</div>
          <div class="card-client">${p.client_name || 'No client name'}</div>
        </div>
        <span class="card-status ${p.status === 'active' ? 's-active' : 's-complete'}">
          ${p.status === 'active' ? '● ACTIVE' : '✓ COMPLETE'}
        </span>
      </div>
      <div class="card-body">
        <div class="card-row">
          <div class="card-field">
            <div class="cf-label">Address</div>
            <div class="cf-val ${!hasDate(p.address) ? 'empty' : ''}">${p.address || 'Not set'}</div>
          </div>
          <div class="card-field">
            <div class="cf-label">PM</div>
            <div class="cf-val ${!p.pm ? 'empty' : ''}">${p.pm || 'Not assigned'}</div>
          </div>
        </div>
        <div class="card-row">
          <div class="card-field">
            <div class="cf-label">Contract Date</div>
            <div class="cf-val ${!hasDate(p.contract_date) ? 'empty' : ''}">${fmt(p.contract_date) || 'Not set'}</div>
          </div>
          <div class="card-field">
            <div class="cf-label">Est. Completion</div>
            <div class="cf-val ${!hasDate(p.est_completion) ? 'empty' : ''}">${fmt(p.est_completion) || 'Not set'}</div>
          </div>
        </div>
        <div class="prog-wrap">
          <div class="prog-top">
            <span class="prog-label">Tasks completed</span>
            <span class="prog-pct">${p.tasks_done} / ${p.tasks_total} · ${progress}%</span>
          </div>
          <div class="prog-bar"><div class="prog-fill" style="width:${progress}%"></div></div>
        </div>
      </div>
      <div class="card-foot">
        <span class="card-date">Updated ${timeAgo(p.updated_at)}</span>
        <button class="card-del" onclick="del(event, ${p.id})">Archive</button>
      </div>
    </a>`;
  }).join('');
}

function timeAgo(dt) {
  if (!dt) return 'recently';
  const diff = (Date.now() - new Date(dt + 'Z').getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

async function del(e, id) {
  e.preventDefault();
  if (!confirm('Archive this project? You can restore it later.')) return;
  await fetch(`/api/projects/${id}`, { method: 'DELETE' });
  load();
}

function openModal() {
  const today = new Date().toISOString().split('T')[0];
  const end = new Date(); end.setMonth(end.getMonth() + 6);
  document.getElementById('f-start').value = today;
  document.getElementById('f-end').value = end.toISOString().split('T')[0];
  document.getElementById('overlay').classList.add('show');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('show');
  ['f-name','f-client','f-addr','f-pm'].forEach(id => document.getElementById(id).value = '');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('overlay').classList.remove('show');
  if (e.key === 'Enter' && document.getElementById('overlay').classList.contains('show')) createProject();
});

async function createProject() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  const body = {
    name,
    client_name: document.getElementById('f-client').value.trim(),
    address: document.getElementById('f-addr').value.trim(),
    contract_date: document.getElementById('f-start').value,
    est_completion: document.getElementById('f-end').value,
    pm: document.getElementById('f-pm').value.trim(),
  };
  const { id } = await fetch('/api/projects', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  }).then(r => r.json());
  window.location.href = `/project.html?id=${id}`;
}

load();
</script>
</body>
</html>
