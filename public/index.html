<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southern Bay Construction — Project Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#1A2733;--mid:#2C3E50;--terra:#B85038;--amber:#C49A3C;
  --cream:#F7F2EB;--sand:#EDE5D8;--white:#FFFFFF;
  --txt:#2C3440;--txt-m:#5A6A7A;--txt-l:#8A9AB0;
  --border:#D5C9BC;--green:#3A6A5A;--green-l:#EAF3E8;
  --pm-bg:#F0F6FA;--pm-bdr:#C8DCE8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--txt);min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:var(--dark);padding:0 24px;display:flex;align-items:center;
  justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;
  border-bottom:3px solid var(--terra);gap:12px}
.tb-brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
.tb-logo{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  color:var(--terra);letter-spacing:2px}
.tb-sep{width:1px;height:18px;background:#2C3E50;flex-shrink:0}
.tb-title{font-family:'DM Serif Display';font-size:16px;color:var(--white);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ── BUTTONS ── */
.btn{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;
  cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--terra);color:#fff}
.btn-primary:hover{background:#C86048}
.btn-outline{background:transparent;color:var(--txt-l);border:1px solid #2C3E50}
.btn-outline:hover{background:#2C3E50;color:#fff}
.btn-green{background:transparent;color:#5AA882;border:1px solid #3A6A5A}
.btn-green:hover{background:#1A3028;color:#7AC8A2}
.btn-danger{background:transparent;color:#D48060;border:1px solid #4A2510}
.btn-danger:hover{background:#2A1510;color:#E89070}
.btn-sm{padding:4px 10px;font-size:11px}
.vtabs{display:flex;gap:3px;background:#0F1C26;padding:4px;border-radius:8px}
.vtab{padding:5px 13px;border-radius:5px;font-size:12px;font-weight:500;
  cursor:pointer;border:none;transition:all .15s;font-family:'DM Sans',sans-serif}
.vtab.on{background:var(--terra);color:#fff}
.vtab:not(.on){background:transparent;color:var(--txt-l)}
.vtab:not(.on):hover{color:#fff;background:#2C3E50}

/* ── BREADCRUMB ── */
.breadcrumb{background:var(--sand);border-bottom:1px solid var(--border);
  padding:8px 24px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-m)}
.bc-link{cursor:pointer;color:var(--terra)}
.bc-link:hover{text-decoration:underline}
.bc-sep{color:var(--border)}

/* ── DASHBOARD ── */
.dashboard{padding:28px 24px}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.dash-h1{font-family:'DM Serif Display';font-size:26px;color:var(--txt)}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.proj-card{background:var(--white);border:1px solid var(--border);border-radius:10px;
  padding:20px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:12px}
.proj-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);border-color:var(--terra);transform:translateY(-1px)}
.pc-name{font-family:'DM Serif Display';font-size:18px;color:var(--txt)}
.pc-meta{display:flex;flex-direction:column;gap:4px}
.pc-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt-m)}
.pc-icon{color:var(--terra);font-size:11px;width:14px;flex-shrink:0}
.pc-progress{margin-top:4px}
.pc-prog-label{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-l);
  font-family:'IBM Plex Mono',monospace;margin-bottom:4px}
.pc-prog-bar{height:4px;background:#E8DDD0;border-radius:2px;overflow:hidden}
.pc-prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s}
.pc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  padding:2px 8px;border-radius:3px;white-space:nowrap}
.badge-pending{background:#FFF8E8;color:#8A6A00;border:1px solid #E8C84A}
.badge-signed{background:var(--green-l);color:var(--green);border:1px solid #B8D8C8}
.empty-state{text-align:center;padding:60px 24px;color:var(--txt-m)}
.empty-icon{font-size:40px;margin-bottom:16px}
.empty-h{font-family:'DM Serif Display';font-size:22px;color:var(--txt);margin-bottom:8px}
.empty-p{font-size:14px;line-height:1.6;margin-bottom:24px}

/* ── PROJECT FORM ── */
.form-wrap{max-width:580px;margin:32px auto;background:var(--white);
  border:1px solid var(--border);border-radius:10px;padding:32px;
  box-shadow:0 4px 20px rgba(0,0,0,.06)}
.form-h{font-family:'DM Serif Display';font-size:24px;color:var(--txt);margin-bottom:8px}
.form-sub{font-size:13px;color:var(--txt-m);margin-bottom:28px;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-full{grid-column:1/-1}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:10px;font-weight:600;color:var(--terra);text-transform:uppercase;letter-spacing:1.2px}
.form-input{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--txt);
  background:var(--sand);border:1px solid var(--border);border-radius:6px;
  padding:9px 12px;outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--terra);background:var(--white)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;
  padding-top:20px;border-top:1px solid var(--border)}

/* ── PROJECT META BAR ── */
.proj-meta{background:var(--sand);border-bottom:1px solid var(--border);
  padding:10px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pm-field{display:flex;align-items:center;gap:6px}
.pm-label{font-size:10px;font-weight:600;color:var(--terra);text-transform:uppercase;letter-spacing:1.2px}
.pm-val{font-size:13px;font-weight:500;color:var(--txt)}
.role-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  margin-left:auto;padding:3px 10px;border-radius:4px}
.role-pm{background:rgba(184,80,56,.12);color:var(--terra);border:1px solid rgba(184,80,56,.3)}
.role-cu{background:#F0F6FA;color:#4A8AAA;border:1px solid var(--pm-bdr)}

/* ── BUDGET PANEL ── */
.budget-panel{background:var(--dark);padding:16px 24px}
.bp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.bp-title{font-family:'DM Serif Display';font-size:17px;color:var(--white)}
.bp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.bp-stat{text-align:center}
.bp-num{font-family:'DM Serif Display';font-size:24px;color:var(--terra)}
.bp-num.green{color:#5AA882}
.bp-num.amber{color:#D4A840}
.bp-lbl{font-size:10px;color:#6A8AA0;margin-top:2px;font-family:'IBM Plex Mono',monospace}

/* ── CHANGE ORDERS PANEL ── */
.co-panel{margin:16px 24px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.co-panel-header{background:var(--dark);padding:10px 18px;display:flex;
  align-items:center;justify-content:space-between}
.co-panel-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  color:#6A90A8;letter-spacing:2px;text-transform:uppercase}
.co-list{display:flex;flex-direction:column}
.co-item{padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:12px}
.co-item:last-child{border-bottom:none}
.co-item.pending{background:#FFFDF5}
.co-item.signed{background:#F5FBF7}
.co-item.rejected{background:#FEF9F8}
.co-status-pill{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  padding:3px 8px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.csp-pending{background:#FFF3CC;color:#8A6A00;border:1px solid #E8C84A}
.csp-signed{background:var(--green-l);color:var(--green);border:1px solid #B8D8C8}
.csp-rejected{background:#FEE8E0;color:var(--terra);border:1px solid #E8C0B0}
.co-body{flex:1;min-width:0}
.co-name{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:3px}
.co-desc{font-size:12px;color:var(--txt-m);line-height:1.5;margin-bottom:8px}
.co-meta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.co-amount{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--terra)}
.co-meta-txt{font-size:11px;color:var(--txt-l)}
.co-sig-line{font-size:11px;color:var(--green);font-weight:500;margin-top:5px}
.co-rej-line{font-size:11px;color:var(--terra);margin-top:5px}
.co-empty{padding:20px 18px;text-align:center;font-size:13px;color:var(--txt-l)}

/* ── LEGEND ── */
.legend{padding:8px 24px;display:flex;gap:18px;align-items:center;
  background:var(--cream);border-bottom:1px solid var(--border);flex-wrap:wrap}
.li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-m)}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.ld-t{background:var(--amber)} .ld-i{background:#9878D0} .ld-g{background:var(--green)}

/* ── PHASE CARDS ── */
.phases{padding:16px 24px 8px;display:flex;flex-direction:column;gap:10px}
.phase{border:1px solid var(--border);border-radius:8px;overflow:hidden;
  background:var(--white);transition:box-shadow .2s}
.phase:hover{box-shadow:0 2px 14px rgba(0,0,0,.08)}
.phase.open{box-shadow:0 4px 22px rgba(0,0,0,.11)}
.strip{display:flex;align-items:center;gap:14px;padding:0 18px;height:54px;
  cursor:pointer;user-select:none;background:var(--dark);
  border-bottom:2px solid transparent;transition:background .15s,border-color .15s}
.strip:hover{background:#20323F}
.phase.open .strip{border-bottom-color:var(--terra)}
.pnum{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  color:var(--terra);background:rgba(184,80,56,.18);border:1px solid rgba(184,80,56,.35);
  padding:4px 11px;border-radius:4px;letter-spacing:1px;white-space:nowrap;flex-shrink:0}
.ptitle{font-family:'DM Serif Display';font-size:17px;color:var(--white);
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdur{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6A8AA0;
  background:#0F1C26;padding:3px 9px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.strip-flags{display:flex;gap:5px;flex-shrink:0}
.sf{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  padding:3px 7px;border-radius:3px;white-space:nowrap}
.sf-t{background:#2A2010;color:#D4A840;border:1px solid #4A3A10}
.sf-i{background:#1A1020;color:#A880D8;border:1px solid #3A2050}
.sf-p{background:#102018;color:#5AA882;border:1px solid #204030}
.sf-co{background:#2A2208;color:#D4A840;border:1px solid #4A3A10}
.sf-ph{background:#101830;color:#6888CC;border:1px solid #203060}
.chev{color:#4A6A7A;font-size:11px;flex-shrink:0;transition:transform .2s}
.phase.open .chev{transform:rotate(180deg);color:var(--terra)}

/* ── COLUMNS ── */
.pcols{display:none}
.phase.open .pcols{display:grid}
.pcols[data-v="both"]{grid-template-columns:1fr 1fr}
.pcols[data-v="customer"]{grid-template-columns:1fr}
.pcols[data-v="pm"]{grid-template-columns:1fr}
.ch{padding:8px 18px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ch.cu{background:#FDFAF6;color:var(--terra);border-bottom:1px solid #EDE8E2;border-right:1px solid var(--border)}
.ch.pm{background:#EEF4F8;color:#4A8AAA;border-bottom:1px solid var(--pm-bdr)}
.cdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cdot.cu{background:var(--terra)} .cdot.pm{background:#4A8AAA}
.cb{padding:16px 18px 20px}
.cb.cu{background:var(--white);border-right:1px solid var(--border)}
.cb.pm{background:var(--pm-bg)}

/* ── CONTENT BLOCKS ── */
.blk{margin-bottom:16px} .blk:last-child{margin-bottom:0}
.blab{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.blab.cu{color:var(--terra)} .blab.pm{color:#3A7A9A}
.btxt{font-size:13px;color:var(--txt-m);line-height:1.65}
.decs{display:flex;flex-direction:column}
.dec{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--txt-m);
  padding:6px 0;border-bottom:1px dashed #E8DDD0;line-height:1.45}
.dec:last-child{border-bottom:none}
.da{color:var(--terra);flex-shrink:0;font-size:13px;margin-top:1px}
.comm{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:5px;
  background:var(--green-l);border-left:3px solid var(--green);
  margin-bottom:6px;font-size:12.5px;color:var(--txt)}
.cf{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  color:var(--green);flex-shrink:0;padding-top:2px;min-width:60px}
.pay{display:flex;align-items:flex-start;gap:8px;margin-top:6px;
  background:var(--green-l);border:1px solid #B8D8C8;border-radius:5px;
  padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--green);line-height:1.45}
.mstn{display:flex;gap:8px;align-items:flex-start;margin-top:10px;
  padding:7px 10px;background:#F0F8F4;border-radius:5px;
  border-left:3px solid var(--green);font-size:12.5px;font-weight:500;
  color:var(--green);line-height:1.4}

/* ── DECISION ITEMS (customer interactive) ── */
.dec-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;
  border-radius:6px;border:1px solid var(--border);background:var(--white);
  margin-bottom:6px;font-size:13px;color:var(--txt-m);cursor:pointer;transition:all .1s}
.dec-item:hover{border-color:#B8C8B8;background:#F8FCF8}
.dec-item.confirmed{background:var(--green-l);border-color:#B8D8C8;color:var(--txt)}
.dec-cb{width:17px;height:17px;border-radius:3px;flex-shrink:0;margin-top:1px;
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;background:white;transition:all .12s;color:white}
.dec-item.confirmed .dec-cb{background:var(--green);border-color:var(--green)}
.dec-text{flex:1}

/* ── TASKS ── */
.tlist{display:flex;flex-direction:column;gap:4px}
.task{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;border-radius:5px;
  font-size:13px;line-height:1.4;color:var(--txt);border:1px solid transparent;
  cursor:pointer;transition:background .1s}
.task:hover{background:rgba(255,255,255,.7)}
.task.trig{background:#FFFBEE;border-color:#E8C84A}
.task.trig:hover{background:#FFFAE0}
.task.insp{background:#F0F4FF;border-color:#B0C0E8}
.task.done{opacity:.55} .task.done .tt{text-decoration:line-through;color:var(--txt-l)}
.tcb{width:17px;height:17px;border-radius:3px;flex-shrink:0;margin-top:1px;
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;background:white;transition:all .12s;color:white}
.task.done .tcb{background:var(--green);border-color:var(--green)}
.tt{flex:1}
.tbadge{font-family:'IBM Plex Mono',monospace;font-size:9px;flex-shrink:0;
  padding:2px 6px;border-radius:3px;margin-top:2px;white-space:nowrap}
.tb-t{background:#FFF3CC;color:#8A6A00}
.tb-i{background:#E8EEFF;color:#3A5AB8}

/* ── COST TABLE ── */
.ctable{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.ctable th{text-align:left;font-size:9px;font-weight:600;text-transform:uppercase;
  letter-spacing:1px;color:#4A8AAA;padding:4px 8px;border-bottom:1px solid var(--pm-bdr);
  background:#E8F2F8}
.ctable th:last-child{text-align:right}
.ctable td{padding:5px 8px;border-bottom:1px solid #DDE8F0;color:var(--txt-m);vertical-align:top}
.ctable td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--txt);white-space:nowrap}
.ctable tr:last-child td{border-bottom:none}
.cref{font-size:10px;color:var(--txt-l);font-style:italic}
.stags{display:flex;flex-wrap:wrap;gap:5px}
.stag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:#E4EEF6;
  color:#3A5870;padding:3px 9px;border-radius:3px;border:1px solid #C4D8E6}

/* ── PHOTOS ── */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.photo-thumb{position:relative;border-radius:6px;overflow:hidden;
  aspect-ratio:1;cursor:pointer;border:1px solid var(--border);background:#F0F0F0}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb:hover .photo-del{opacity:1}
.photo-del{opacity:0;position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);
  color:#fff;border:none;border-radius:3px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer;transition:opacity .15s}
.photo-caption{font-size:10px;color:var(--txt-l);margin-top:3px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-add{border:2px dashed var(--border);border-radius:6px;aspect-ratio:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;background:transparent;font-size:11px;
  color:var(--txt-l);gap:4px;width:100%}
.photo-add:hover{border-color:var(--terra);color:var(--terra);background:#FEF5F2}

/* ── SUMMARY ── */
.summary{margin:8px 24px 32px;padding:20px 24px;background:var(--dark);
  border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ss{text-align:center}
.sn{font-family:'DM Serif Display';font-size:28px;color:var(--terra)}
.sl{font-size:11px;color:#6A8AA0;margin-top:3px}
.sf2{grid-column:1/-1;font-size:11px;color:#4A6A7A;text-align:center;
  font-family:'IBM Plex Mono',monospace;border-top:1px solid #2C3E50;
  padding-top:12px;margin-top:4px}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:999;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:12px;padding:28px 32px;
  max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);
  max-height:90vh;overflow-y:auto}
.modal h3{font-family:'DM Serif Display';font-size:22px;color:var(--txt);margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--txt-m);margin-bottom:22px;line-height:1.5}
.modal-body{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.co-review-box{background:var(--sand);border:1px solid var(--border);border-radius:8px;
  padding:16px;margin-bottom:20px}
.co-review-title{font-family:'DM Serif Display';font-size:18px;color:var(--txt);margin-bottom:12px}
.co-review-row{display:flex;justify-content:space-between;align-items:flex-start;
  font-size:13px;color:var(--txt-m);padding:6px 0;border-bottom:1px dashed #E8DDD0;gap:12px}
.co-review-row:last-child{border-bottom:none}
.co-review-val{font-weight:600;color:var(--txt);text-align:right;flex-shrink:0}
.co-amount-display{font-family:'DM Serif Display';font-size:32px;color:var(--terra);
  text-align:center;padding:16px 0 8px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--dark);color:#fff;padding:10px 22px;border-radius:6px;
  font-size:13px;z-index:9999;transition:transform .3s ease;white-space:nowrap;
  border-left:3px solid var(--green);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── PROGRESS BAR (overall) ── */
.overall-progress{background:var(--sand);border-bottom:1px solid var(--border);
  padding:8px 24px;display:flex;align-items:center;gap:14px}
.op-label{font-size:10px;font-weight:600;color:var(--terra);text-transform:uppercase;
  letter-spacing:1.2px;white-space:nowrap}
.op-bar-wrap{flex:1;height:5px;background:#DDD5C8;border-radius:3px;overflow:hidden}
.op-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.op-count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--txt-m);white-space:nowrap}

/* ── CUSTOMER PORTAL HEADER ── */
.cu-welcome{background:linear-gradient(135deg,#1A2733 0%,#2C3E50 100%);
  padding:24px;border-bottom:3px solid var(--terra);margin-bottom:0}
.cu-welcome-inner{max-width:700px}
.cu-welcome-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  color:var(--terra);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.cu-welcome-title{font-family:'DM Serif Display';font-size:26px;color:var(--white);margin-bottom:8px}
.cu-welcome-sub{font-size:13px;color:#6A8AA0;line-height:1.6}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .pcols[data-v="both"]{grid-template-columns:1fr}
  .cb.cu{border-right:none;border-bottom:1px solid var(--border)}
  .ch.cu{border-right:none}
  .phases{padding:12px 14px 8px}
  .summary{grid-template-columns:repeat(2,1fr);margin:0 14px 24px}
  .topbar,.proj-meta,.legend,.breadcrumb,.overall-progress{padding-left:14px;padding-right:14px}
  .co-panel{margin-left:14px;margin-right:14px}
  .budget-panel{padding:14px}
  .bp-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .dashboard{padding:16px 14px}
  .project-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .tb-title{display:none}
  .tb-right{gap:5px}
  .btn-sm{padding:4px 8px;font-size:10px}
  .vtab{padding:4px 8px;font-size:11px}
}
@media print{
  .topbar,.breadcrumb,.legend,.overall-progress,.co-panel,.budget-panel,
  .strip-flags,.chev,.pcols .pm,.summary,.modal-overlay{display:none!important}
  body{background:white}
  .phases{padding:0;gap:8px}
  .phase{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .pcols[data-v="both"]{grid-template-columns:1fr!important}
  .cb.cu{border-right:none}
  .strip{background:#1A2733!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<div id="app"></div>

<!-- CO CREATE MODAL -->
<div class="modal-overlay" id="co-modal">
  <div class="modal">
    <h3>Add Change Order</h3>
    <p class="modal-sub">Document a scope change. The customer will see it in their portal and can sign off with a timestamp.</p>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Phase</label>
        <select class="form-input" id="co-phase"></select>
      </div>
      <div class="form-field">
        <label class="form-label">Title *</label>
        <input class="form-input" id="co-title" placeholder="e.g. Additional windows in master bedroom">
      </div>
      <div class="form-field">
        <label class="form-label">Description</label>
        <textarea class="form-input" id="co-desc" rows="3"
          placeholder="Describe the change, the reason, and any impact on schedule..."
          style="resize:vertical"></textarea>
      </div>
      <div class="form-field">
        <label class="form-label">Amount ($) — enter 0 for no-cost change</label>
        <input class="form-input" id="co-amount" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('co-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitCO()">Add Change Order</button>
    </div>
  </div>
</div>

<!-- CO SIGN MODAL -->
<div class="modal-overlay" id="sign-modal">
  <div class="modal">
    <h3 id="sign-modal-title">Review Change Order</h3>
    <p class="modal-sub">Review the details below carefully. Your signature is legally binding.</p>
    <div id="sign-modal-detail"></div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Full Name (electronic signature)</label>
        <input class="form-input" id="sign-name" placeholder="Type your full name to sign">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-danger" onclick="rejectCO()">Decline</button>
      <button class="btn btn-outline" onclick="closeModal('sign-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="signCO()">Sign &amp; Approve</button>
    </div>
  </div>
</div>

<!-- PHOTO UPLOAD MODAL -->
<div class="modal-overlay" id="photo-modal">
  <div class="modal">
    <h3 id="photo-modal-title">Add Photo</h3>
    <p class="modal-sub" id="photo-modal-sub">Select a photo to attach to this phase. Images are resized automatically.</p>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Photo *</label>
        <input type="file" id="photo-file" accept="image/*" class="form-input" style="padding:6px">
      </div>
      <div class="form-field">
        <label class="form-label">Caption (optional)</label>
        <input class="form-input" id="photo-caption" placeholder="e.g. Framing complete — east elevation">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('photo-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitPhoto()">Upload Photo</button>
    </div>
  </div>
</div>

// ════════════════════════════════════════════════════════════
//  API  (server-backed)
// ════════════════════════════════════════════════════════════
const API = {
  async _json(url, opts){
    const r = await fetch(url, opts)
    if(!r.ok) throw new Error(`${r.status} ${r.statusText}`)
    return r.json()
  },
  _post(url, body){
    return this._json(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
  },
  _put(url, body){
    return this._json(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  },
  getProjects()              { return this._json('/api/projects') },
  getProject(id)             { return this._json(`/api/projects/${id}`) },
  createProject(data)        { return this._post('/api/projects', data) },
  deleteProject(id)          { return this._json(`/api/projects/${id}`,{method:'DELETE'}) },
  getBudget(id)              { return this._json(`/api/projects/${id}/budget`) },
  updateBudgetItem(pid,bid,data){ return this._put(`/api/projects/${pid}/budget/${bid}`,data) },
  getCOs(id)                 { return this._json(`/api/projects/${id}/cos`) },
  addCO(id,data)             { return this._post(`/api/projects/${id}/cos`,data) },
  signCO(pid,cid,signed_by)  { return this._post(`/api/projects/${pid}/cos/${cid}/sign`,{signed_by}) },
  rejectCO(pid,cid,reason)   { return this._post(`/api/projects/${pid}/cos/${cid}/reject`,{reason}) },
  getTaskStates(id)          { return this._json(`/api/projects/${id}/tasks`) },
  setTaskState(id,key,done)  { return this._post(`/api/projects/${id}/tasks`,{task_key:key,done}) },
  getDecisions(id)           { return this._json(`/api/projects/${id}/decisions`) },
  setDecision(id,phase_id,dec_index,confirmed){ return this._post(`/api/projects/${id}/decisions`,{phase_id,dec_index,confirmed}) },
  generateCustomerLink(id)   { return this._post(`/api/projects/${id}/customer-link`) },
}

// Photos stay in localStorage (binary data, PM-browser only)
const Photos = {
  get(pid)  { return JSON.parse(localStorage.getItem('sbc_ph_'+pid)||'{}') },
  save(pid,d){ localStorage.setItem('sbc_ph_'+pid,JSON.stringify(d)) },
  add(pid,phaseId,dataUrl,caption){
    const p=this.get(pid); if(!p[phaseId]) p[phaseId]=[]
    p[phaseId].push({id:'ph_'+Date.now(),dataUrl,caption,uploadedAt:Date.now()})
    this.save(pid,p)
  },
  del(pid,phaseId,photoId){
    const p=this.get(pid)
    if(p[phaseId]) p[phaseId]=p[phaseId].filter(x=>x.id!==photoId)
    this.save(pid,p)
  }
}

let STATE = {view:'dashboard',projectId:null,role:'pm',openPhases:new Set([1]),
             _project:null,_cos:[],_budget:[],_tasks:{},_decisions:{}}
let _pendingCOProjectId=null,_pendingCOId=null,_pendingPhotoPhaseId=null,_pendingPhotoProjectId=null

function navigate(hash){ window.location.hash = hash }

async function parseHash(){
  const h = (window.location.hash||'').replace(/^#/,'').trim()
  if(!h || h==='dashboard'){
    STATE.view='dashboard'; STATE.projectId=null; STATE.role='pm'
  } else if(h==='new'){
    STATE.view='new-project'
  } else if(h.startsWith('p/')){
    const parts = h.split('/')
    const prevId = STATE.projectId
    STATE.projectId = parts[1]
    STATE.role = parts[2]==='c' ? 'customer' : 'pm'
    STATE.view = 'project'
    if(STATE.projectId !== prevId) STATE.openPhases = new Set([1])
  }
  await renderApp()
}

window.addEventListener('hashchange', ()=>parseHash().catch(console.error))

// ════════════════════════════════════════════════════════════
//  RENDER ENGINE
// ════════════════════════════════════════════════════════════
async function renderApp(){
  const app = document.getElementById('app')
  if(STATE.view==='dashboard'){
    const projects = await API.getProjects()
    app.innerHTML = renderDashboard(projects)
  } else if(STATE.view==='new-project'){
    app.innerHTML = renderProjectForm()
    const today = new Date()
    const el = document.getElementById('f-start')
    if(el && !el.value) el.value = today.toISOString().split('T')[0]
    const endEl = document.getElementById('f-end')
    if(endEl && !endEl.value){
      const end = new Date(today); end.setMonth(end.getMonth()+6)
      endEl.value = end.toISOString().split('T')[0]
    }
  } else if(STATE.view==='project'){
    const [proj,cos,budget,tasks,decisions] = await Promise.all([
      API.getProject(STATE.projectId),
      API.getCOs(STATE.projectId),
      API.getBudget(STATE.projectId),
      API.getTaskStates(STATE.projectId),
      API.getDecisions(STATE.projectId),
    ])
    if(!proj||proj.error){ navigate(''); return }
    // Auto-seed budget items for projects created before this feature existed
    if(!budget.length){
      const items = []
      for(const ph of PHASES)
        for(const c of (ph.pm.costs||[]))
          items.push({phase_id:ph.id, item:c.item, amt:c.amt??null, note:c.note||''})
      try {
        await fetch(`/api/projects/${STATE.projectId}/budget/seed`,{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({budget_items:items})
        })
        const fresh = await API.getBudget(STATE.projectId)
        STATE._budget = fresh
      } catch(e){ STATE._budget = [] }
    } else { STATE._budget = budget }
    STATE._project=proj; STATE._cos=cos
    STATE._tasks=tasks;  STATE._decisions=decisions
    app.innerHTML = renderProject(proj,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role)
  }
}

function _rerender(){
  if(STATE._project)
    document.getElementById('app').innerHTML =
      renderProject(STATE._project,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role)
}

    <div class="decs">
      ${ph.cu.decisions.map((d,i)=>{
        if(isPM) return `<div class="dec"><span class="da">›</span><span>${esc(d)}</span></div>`
        const k=`${ph.id}_${i}`
        const done = decisions&&decisions[k]
        return `<div class="dec-item${done?' confirmed':''}" onclick="toggleDecision('${proj.id}',${ph.id},${i})">
          <div class="dec-cb">${done?'✓':''}</div>
          <span class="dec-text">${esc(d)}</span>
        </div>`
      }).join('')}
    </div>
  </div>` : ''

  const commHtml = `<div class="blk">
    <div class="blab cu">Communication checkpoints</div>
    ${ph.cu.comms.map(c=>`<div class="comm"><span class="cf">${c.f}</span><span>${esc(c.t)}</span></div>`).join('')}
  </div>`

  const payHtml = ph.cu.pay
    ? `<div class="blk"><div class="pay">💰 ${esc(ph.cu.pay)}</div></div>`
    : ''

  const phaseCOHtml = (cos.length && !isPM) ? `<div class="blk">
    <div class="blab cu">Change Orders — This Phase</div>
    ${cos.map(co=>{
      const pill = {
        pending:`<span class="co-status-pill csp-pending">Pending Your Approval</span>`,
        signed: `<span class="co-status-pill csp-signed">Approved by You</span>`,
        rejected:`<span class="co-status-pill csp-rejected">Declined</span>`
      }[co.status]
      const signBtn = co.status==='pending'
        ? `<button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="openSignModal('${proj.id}','${co.id}')">Review &amp; Sign</button>` : ''
      return `<div class="co-item ${co.status}" style="border-radius:6px;margin-bottom:6px">
        <div>${pill}</div>
        <div class="co-body">
          <div class="co-name">${esc(co.title)}</div>
          ${co.description?`<div class="co-desc">${esc(co.description)}</div>`:''}
          <div class="co-amount" style="margin-top:4px">${co.amount&&parseFloat(co.amount)>0?'+'+fmt(parseFloat(co.amount)):'No cost change'}</div>
          ${signBtn}
        </div>
      </div>`
    }).join('')}
  </div>` : ''

  const cuCol = `
    <div class="ch cu"><div class="cdot cu"></div>${isPM?'Customer-facing':'What You Need to Know'}</div>
    <div class="cb cu">
      <div class="blk"><div class="blab cu">What's happening</div><div class="btxt">${esc(ph.cu.what)}</div></div>
      ${decHtml}${commHtml}${payHtml}${phaseCOHtml}${photosHtml}
      <div class="mstn">✓ ${esc(ph.cu.mstn)}</div>
    </div>`

  if(!isPM){
    return `<div class="phase open" id="ph-${ph.id}">${strip}
      <div class="pcols" data-v="customer">${cuCol}</div>
    </div>`
  }

  // PM column
  const tasksHtml = ph.pm.tasks.map((t,i)=>{
    const k=`${ph.id}_${i}`
    const done = tasks&&tasks[k]
    const cls=['task',t.fl==='trig'?'trig':t.fl==='insp'?'insp':'',done?'done':''].filter(Boolean).join(' ')
    const badge = t.b?`<span class="tbadge ${t.fl==='trig'?'tb-t':t.fl==='insp'?'tb-i':''}">${t.b}</span>`:''
    return `<div class="${cls}" onclick="toggleTask('${proj.id}',${ph.id},${i})">
      <div class="tcb">${done?'✓':''}</div>
      <span class="tt">${esc(t.t)}</span>${badge}
    </div>`
  }).join('')

  const costsHtml = phaseBudget.length?`<div class="blk">
    <div class="blab pm" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Cost reference (per-project)</span>
      <span style="font-size:9px;color:#4A8AAA;font-family:'IBM Plex Mono',monospace;font-weight:400">✎ CLICK TO EDIT</span>
    </div>
    <table class="ctable">
      <tr><th>Line Item</th><th style="text-align:right">Amount</th></tr>
      ${phaseBudget.map(b=>{
        const display = b.amt!==null&&b.amt!==undefined ? fmt(b.amt) : '<span style="color:#B88">— quote</span>'
        return `<tr>
          <td>${esc(b.item)}${b.note?`<br><span class="cref">${esc(b.note)}</span>`:''}</td>
          <td class="budget-amt-cell" onclick="startBudgetEdit(this)"
              data-item-id="${b.id}" data-project-id="${proj.id}"
              data-amt="${b.amt!==null&&b.amt!==undefined?b.amt:''}"
              data-note="${escAttr(b.note||'')}"
              style="cursor:pointer;user-select:none;" title="Click to edit amount">
            ${display}&nbsp;<span style="font-size:9px;color:#4A8AAA;opacity:.6">✎</span>
          </td>
        </tr>`
      }).join('')}
    </table>
  </div>`:''

  const subsHtml = ph.pm.subs&&ph.pm.subs.length?`<div class="blk">
    <div class="blab pm">Subcontractors</div>
    <div class="stags">${ph.pm.subs.map(s=>`<span class="stag">${esc(s)}</span>`).join('')}</div>
  </div>`:''

  const pmCol = `
    <div class="ch pm"><div class="cdot pm"></div>PM / Internal</div>
    <div class="cb pm">
      <div class="blk"><div class="blab pm">Task sequence</div><div class="tlist">${tasksHtml}</div></div>
      ${costsHtml}${subsHtml}
    </div>`

  return `<div class="phase open" id="ph-${ph.id}">${strip}
    <div class="pcols" data-v="both">${cuCol}${pmCol}</div>
  </div>`
}

async function createProject(){
  const name = document.getElementById('f-name').value.trim()
  if(!name){ showToast('⚠ Project name is required'); return }
  const budget_items = []
  for(const ph of PHASES){
    for(const c of (ph.pm.costs||[])){
      budget_items.push({phase_id:ph.id, item:c.item, amt:c.amt??null, note:c.note||''})
    }
  }
  try {
    const result = await API.createProject({
      name,
      client_name:    document.getElementById('f-client').value.trim(),
      address:        document.getElementById('f-address').value.trim(),
      contract_date:  document.getElementById('f-start').value,
      est_completion: document.getElementById('f-end').value,
      pm:             document.getElementById('f-pm').value.trim(),
      budget_items,
    })
    navigate('p/'+result.id)
  } catch(e){ showToast('⚠ Failed to create project') }
}

function togglePhase(id){
  if(!STATE.openPhases) STATE.openPhases = new Set()
  STATE.openPhases.has(id) ? STATE.openPhases.delete(id) : STATE.openPhases.add(id)
  if(STATE._project)
    document.getElementById('app').innerHTML =
      renderProject(STATE._project,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role)
}

async function toggleTask(pid, phaseId, taskIdx){
  const k=`${phaseId}_${taskIdx}`
  const was = STATE._tasks&&STATE._tasks[k]
  if(STATE._tasks) STATE._tasks[k]=!was
  if(STATE._project) document.getElementById('app').innerHTML =
    renderProject(STATE._project,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role)
  try { await API.setTaskState(pid,k,!was) }
  catch(e){ if(STATE._tasks) STATE._tasks[k]=was; showToast('⚠ Failed to save'); if(STATE._project) document.getElementById('app').innerHTML=renderProject(STATE._project,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role) }
}

async function toggleDecision(pid, phaseId, decIdx){
  const k=`${phaseId}_${decIdx}`
  const was = STATE._decisions&&STATE._decisions[k]
  if(STATE._decisions) STATE._decisions[k]=!was
  if(STATE._project) document.getElementById('app').innerHTML =
    renderProject(STATE._project,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role)
  try { await API.setDecision(pid,phaseId,decIdx,!was) }
  catch(e){ if(STATE._decisions) STATE._decisions[k]=was; showToast('⚠ Failed to save') }
}

// ── Budget inline edit ──
function startBudgetEdit(td){
  if(td.querySelector('input')) return
  const itemId    = td.dataset.itemId
  const projectId = td.dataset.projectId
  const currentAmt  = td.dataset.amt
  const currentNote = td.dataset.note

  const input = document.createElement('input')
  input.type='number'; input.step='0.01'; input.min='0'; input.value=currentAmt
  input.style.cssText='width:100px;font-family:inherit;font-size:11px;text-align:right;padding:3px 6px;border:1.5px solid #4A8AAA;border-radius:3px;background:#fff;outline:none;'

  let committed=false
  async function commit(){
    if(committed) return; committed=true
    const amt = input.value.trim()==='' ? null : parseFloat(input.value)
    if(STATE._budget){ const it=STATE._budget.find(b=>String(b.id)===String(itemId)); if(it) it.amt=amt }
    try { await API.updateBudgetItem(projectId,itemId,{amt,note:currentNote}) }
    catch(e){ showToast('⚠ Failed to save budget item') }
    await renderApp()
  }

  td.innerHTML=''; td.appendChild(input); input.focus(); input.select()
  input.addEventListener('blur', commit)
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); input.blur() }
    if(e.key==='Escape'){ committed=true; renderApp() }
  })
}

// ── Change Orders ──
function openCOModal(pid){
  _pendingCOProjectId = pid
  const sel = document.getElementById('co-phase')
  sel.innerHTML = PHASES.map(p=>`<option value="${p.id}">Phase ${String(p.id).padStart(2,'0')}: ${p.name}</option>`).join('')
  document.getElementById('co-title').value = ''
  document.getElementById('co-desc').value  = ''
  document.getElementById('co-amount').value = ''
  openModal('co-modal')
}

async function submitCO(){
  const title = document.getElementById('co-title').value.trim()
  if(!title){ showToast('⚠ Change order title is required'); return }
  try {
    await API.addCO(_pendingCOProjectId,{
      phase_id:    document.getElementById('co-phase').value,
      title,
      description: document.getElementById('co-desc').value.trim(),
      amount:      document.getElementById('co-amount').value,
    })
    closeModal('co-modal')
    showToast('Change order added — customer will see it in their portal')
    await renderApp()
  } catch(e){ showToast('⚠ Failed to add change order') }
}

function openSignModal(pid, coId){
  _pendingCOProjectId = pid
  _pendingCOId = coId
  const co = STATE._cos&&STATE._cos.find(c=>c.id===coId); if(!co) return
  const ph = PHASES.find(p=>p.id===parseInt(co.phase_id))
  document.getElementById('sign-modal-title').textContent = co.title
  document.getElementById('sign-modal-detail').innerHTML = `
    <div class="co-review-box">
      <div class="co-review-title">${esc(co.title)}</div>
      ${co.description?`<div class="co-review-row"><span>Description</span><span class="co-review-val">${esc(co.description)}</span></div>`:''}
      <div class="co-review-row"><span>Phase</span><span class="co-review-val">${ph?ph.name:'Phase '+co.phase_id}</span></div>
      <div class="co-review-row"><span>Requested</span><span class="co-review-val">${fmtDate(co.requested_at)}</span></div>
      <div class="co-amount-display">${co.amount&&parseFloat(co.amount)>0?'+'+fmt(parseFloat(co.amount)):'No additional cost'}</div>
    </div>`
  document.getElementById('sign-name').value = ''
  openModal('sign-modal')
}

async function signCO(){
  const name = document.getElementById('sign-name').value.trim()
  if(!name){ showToast('⚠ Please enter your full name to sign'); return }
  try {
    await API.signCO(_pendingCOProjectId,_pendingCOId,name)
    closeModal('sign-modal')
    showToast('✓ Change order approved and signed')
    await renderApp()
  } catch(e){ showToast('⚠ Failed to sign') }
}

async function rejectCO(){
  const reason = prompt('Reason for declining (optional):') || ''
  try {
    await API.rejectCO(_pendingCOProjectId,_pendingCOId,reason)
    closeModal('sign-modal')
    showToast('Change order declined')
    await renderApp()
  } catch(e){ showToast('⚠ Failed to decline') }
}

// ── Customer Link ──
async function copyCustomerLink(pid){
  try {
    const {url} = await API.generateCustomerLink(pid)
    const full = `${location.origin}${url}`
    navigator.clipboard.writeText(full)
      .then(()=>showToast('✓ Secure customer link copied'))
      .catch(()=>prompt('Copy this secure link for your client:',full))
  } catch(e){ showToast('⚠ Failed to generate customer link') }
}

// ── Photos (localStorage) ──
function openPhotoModal(pid, phaseId){
  _pendingPhotoProjectId=pid; _pendingPhotoPhaseId=phaseId
  const ph=PHASES.find(p=>p.id===phaseId)
  document.getElementById('photo-modal-title').textContent=`Add Photo — Phase ${phaseId}`
  document.getElementById('photo-modal-sub').textContent=ph
    ?`Attach a photo to "${ph.name}". Images are resized to max 800px automatically.`:'Select a photo to attach.'
  document.getElementById('photo-file').value=''
  document.getElementById('photo-caption').value=''
  openModal('photo-modal')
}

function submitPhoto(){
  const file=document.getElementById('photo-file').files[0]
  if(!file){ showToast('⚠ Please select a photo'); return }
  const caption=document.getElementById('photo-caption').value.trim()
  const reader=new FileReader()
  reader.onload=e=>{
    const img=new Image()
    img.onload=()=>{
      const canvas=document.createElement('canvas')
      const MAX=800; let w=img.width,h=img.height
      if(w>MAX){ h=Math.round(h*MAX/w); w=MAX }
      canvas.width=w; canvas.height=h
      canvas.getContext('2d').drawImage(img,0,0,w,h)
      const dataUrl=canvas.toDataURL('image/jpeg',0.82)
      try {
        Photos.add(_pendingPhotoProjectId,_pendingPhotoPhaseId,dataUrl,caption)
        closeModal('photo-modal')
        showToast('✓ Photo added to phase')
        if(STATE._project) document.getElementById('app').innerHTML=
          renderProject(STATE._project,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role)
        setTimeout(()=>document.getElementById('ph-'+_pendingPhotoPhaseId)?.scrollIntoView({behavior:'smooth',block:'nearest'}),100)
      } catch(err){
        alert('Storage limit reached. Try deleting older photos or using smaller images.')
      }
    }
    img.src=e.target.result
  }
  reader.readAsDataURL(file)
}

function deletePhotoEvt(e,pid,phaseId,photoId){
  e.stopPropagation()
  if(!confirm('Delete this photo?')) return
  Photos.del(pid,phaseId,photoId)
  showToast('Photo deleted')
  if(STATE._project) document.getElementById('app').innerHTML=
    renderProject(STATE._project,STATE._cos,STATE._budget,STATE._tasks,STATE._decisions,STATE.role)
}

function viewPhoto(url){
  document.getElementById('lightbox-img').src=url
  openModal('lightbox')
}

// ── Modal helpers ──
function openModal(id){ document.getElementById(id).classList.add('open') }
function closeModal(id){ document.getElementById(id).classList.remove('open') }

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay=>{
  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.classList.remove('open') })
})

// ── Toast ──
let _toastTimer = null
function showToast(msg){
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(()=>t.classList.remove('show'),3200)
}

// ── Utils ──
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') }
function fmtDate(val){
  if(!val) return '—'
  const d = new Date(typeof val==='number' ? val : String(val).replace(' ','T')+'Z')
  return isNaN(d)?'—':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
}
